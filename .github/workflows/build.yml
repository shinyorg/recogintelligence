name: Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches:
    - main
    - v*
    paths-ignore:
      - 'Sample/**'
      - 'CLAUDE.md'
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC)
      contents: read

    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          # Nerdbank.GitVersioning needs the full history to compute {height}
          fetch-depth: 0

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
          dotnet-version: '10.0.x'
          # macos is required by Shiny.DocumentIntelligence's net10.0-macos (AppKit) target
          workloads: maui, ios, android, maccatalyst, macos

    - name: Build
      run: dotnet build build.slnf /restore -m -property:Configuration=Release -property:PublicRelease=true

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nugets
        path: ${{ github.workspace }}/artifacts
        retention-days: 5

    - name: NuGet Login (OIDC)
      id: nuget-login
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
      uses: NuGet/login@v1
      with:
        user: aritchie

    - name: Publish NuGets
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
      run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
